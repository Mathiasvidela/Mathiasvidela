  <g fill="#39ff6a">
    <rect x="26" y="29" width="6" height="14"><animate attributeName="height" values="14;38;14" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="29;17;29" dur=".9s" repeatCount="indefinite"/></rect>
    <rect x="39" y="23" width="6" height="26"><animate attributeName="height" values="26;8;26" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="23;32;23" dur=".7s" repeatCount="indefinite"/></rect>
    <rect x="52" y="16" width="6" height="40"><animate attributeName="height" values="40;16;40" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;28;16" dur="1.1s" repeatCount="indefinite"/></rect>
