<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 85 1200 390" role="img" aria-labelledby="t d">
<title id="t">Mathias Videla — Backend Developer</title><desc id="d">Mathias Videla. Tecla de código flotante y órbitas azules sobre un fondo oscuro.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7b8cff" stroke-opacity=".07"/></pattern>
<radialGradient id="halo"><stop stop-color="#133df6" stop-opacity=".28"/><stop offset="1" stop-color="#133df6" stop-opacity="0"/></radialGradient>
<linearGradient id="key" x2=".8" y2="1"><stop stop-color="#365cff"/><stop offset="1" stop-color="#1025ac"/></linearGradient>
<style>
.mono{font-family:'Courier New',monospace}.sans{font-family:Arial,Helvetica,sans-serif}.orbit{transform-origin:916px 286px;animation:orbit 24s linear infinite}.float{animation:float 6s ease-in-out infinite}.flow{stroke-dasharray:12 220;animation:flow 4s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 8s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes flow{to{stroke-dashoffset:-464}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(220px)}}
@media(prefers-reduced-motion:reduce){.orbit,.float,.flow,.pulse,.scan{animation:none}}
</style></defs>
<rect width="1200" height="700" fill="#09090b"/><ellipse cx="920" cy="275" rx="315" ry="290" fill="url(#halo)"/>
<text x="54" y="232" class="sans" fill="#fafafa" font-size="108" font-weight="900" letter-spacing="-7">MATHIAS</text>
<text x="54" y="340" class="sans" fill="#133df6" font-size="126" font-weight="900" letter-spacing="-7">VIDELA.</text>
<text x="62" y="389" font-family="Georgia,serif" fill="#e4e4e7" font-size="26" font-style="italic">Lo que no se ve, también se diseña.</text>
<g fill="none" stroke="#365cff"><ellipse cx="916" cy="286" rx="202" ry="75" transform="rotate(-32 916 286)" opacity=".45"/><ellipse cx="916" cy="286" rx="202" ry="75" transform="rotate(45 916 286)" opacity=".25"/><circle cx="916" cy="286" r="173" stroke-dasharray="2 13" opacity=".4"/></g>
<g class="orbit"><circle cx="916" cy="113" r="5" fill="#fafafa"/><circle cx="916" cy="459" r="3" fill="#5575ff"/><circle cx="916" cy="286" r="173" fill="none" stroke="#133df6" stroke-width="2" stroke-dasharray="80 1008"/></g>
<g class="float"><g transform="rotate(-12 916 286)">
<rect x="822" y="204" width="190" height="190" rx="34" fill="#070e47" stroke="#3c55bd"/><rect x="822" y="187" width="190" height="190" rx="34" fill="url(#key)" stroke="#6d85ff"/>
<rect x="837" y="202" width="160" height="160" rx="25" fill="none" stroke="#9caaff" stroke-opacity=".35"/>
<path d="M877 253L851 280L877 307M955 253L981 280L955 307M928 244L904 316" fill="none" stroke="#fff" stroke-width="9"/>
<text x="917" y="345" class="mono" fill="#b5c3ff" font-size="10" letter-spacing="3" text-anchor="middle">BUILD / REPEAT</text></g></g>
<g class="mono" font-size="11" letter-spacing="1"><rect x="1020" y="137" width="107" height="30" rx="15" fill="#101326" stroke="#303f87"/><text x="1074" y="157" text-anchor="middle" fill="#bcc8ff">{ JAVA }</text><rect x="735" y="384" width="150" height="30" rx="15" fill="#101326" stroke="#303f87"/><text x="810" y="404" text-anchor="middle" fill="#bcc8ff">SPRING BOOT</text></g>
</svg>
