@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes flow{to{stroke-dashoffset:-464}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(220px)}}
@media(prefers-reduced-motion:reduce){.orbit,.float,.flow,.pulse,.scan{animation:none}}
</style></defs>
