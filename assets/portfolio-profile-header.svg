<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Mathias Videla — Backend Developer</title><desc id="d">Poster animado azul eléctrico: una tecla de código flotante, órbitas y un flujo de datos entre API, lógica y persistencia. Java y Spring Boot. Córdoba, Argentina.</desc>
<defs>
